services:
  - type: web
    name: monitoramento-infobh
    runtime: go
    plan: starter
    buildCommand: mkdir -p internal/server/web/static/downloads && GOOS=windows GOARCH=amd64 go build -o internal/server/web/static/downloads/infobh-agent-windows-amd64.exe ./cmd/agent && GOOS=windows GOARCH=386 go build -o internal/server/web/static/downloads/infobh-agent-windows-386.exe ./cmd/agent && go build -tags netgo -ldflags '-s -w' -o app
    startCommand: ./app
    healthCheckPath: /healthz
    disk:
      name: monitoramento-data
      mountPath: /data
      sizeGB: 10
    envVars:
      - key: MONITOR_DB_PATH
        value: /data/monitoramento.db
      - key: MONITOR_RETENTION_DAYS
        value: 30
